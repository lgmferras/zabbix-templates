# Zabbix Agent 2 — UserParameters: Kairos
# Para: Windows Server com Zabbix Agent 2 (active mode)
# Destino: C:\Program Files\Zabbix Agent 2\zabbix_agent2.d\

############ ADVANCED PARAMETERS #################

Timeout=30

####### USER-DEFINED MONITORED PARAMETERS #######

UnsafeUserParameters=1

# ============================================================================
# Kairos Notify Process Connect Monitoring
# Para: Windows Server com Zabbix Agent 7.4
# ============================================================================

# Verifica se o processo NotifyKairosConnect está rodando
# Retorna: 1 = rodando, 0 = parado
UserParameter=kairos.NotifyKairosConnect,powershell -NoProfile -Command "if(Get-Process -Name NotifyKairosConnect -ErrorAction SilentlyContinue){1}else{0}"
