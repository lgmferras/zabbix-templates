Timeout=30
UnsafeUserParameters=1

# ==============================================================================
# WireGuard Tunnel by Zabbix agent — UserParameters para Windows Server
# ==============================================================================
# Requisitos:
#   - WireGuard for Windows instalado em C:\Program Files\WireGuard\
#     (inclui wg.exe com os mesmos comandos do Linux)
#   - O serviço Zabbix Agent 2 deve rodar como LocalSystem ou conta com
#     permissão para executar wg.exe (geralmente requer privilégios elevados)
#   - PowerShell 5.1+ (incluso no Windows Server 2016+)
#
# Instalar em: C:\Program Files\Zabbix Agent 2\zabbix_agent2.d\user_parameters_wireguard.conf
# Recarregar:  Restart-Service "Zabbix Agent 2"
#
# Nota sobre macros Zabbix em UserParameters:
#   O Zabbix substitui $1-$9 antes de executar o comando.
#   $1 = primeiro parâmetro do item (ex: nome da interface)
#   $2 = segundo parâmetro (ex: {$WG.HANDSHAKE.MAX_AGE} = 300)
#   Variáveis PowerShell como $wg, $now, $r não são afetadas (têm letras, não dígitos)
# ==============================================================================

# 1. Interface ativa (1=up, 0=down/inexistente)
UserParameter=wireguard.interface.up[*],powershell -NoProfile -Command "try{$a=Get-NetAdapter -Name '$1' -ErrorAction Stop; if($a.Status -eq 'Up'){1}else{0}}catch{0}"

# 2. Total de peers configurados
#    Atribuição sem parênteses externos para não imprimir as public keys junto com o count.
UserParameter=wireguard.peers.total[*],powershell -NoProfile -Command "try{$wg='C:\Program Files\WireGuard\wg.exe'; $r=& $wg show $1 peers 2>$null | Where-Object{$_}; ($r | Measure-Object).Count}catch{0}"

# 3. Peers online (handshake mais recente que $2 segundos)
#    $1 = interface, $2 = {$WG.HANDSHAKE.MAX_AGE} passado pelo Zabbix
#    [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() evita o problema do %s no cmd.exe
UserParameter=wireguard.peers.online[*],powershell -NoProfile -Command "try{$wg='C:\Program Files\WireGuard\wg.exe'; $now=[DateTimeOffset]::UtcNow.ToUnixTimeSeconds(); $max=[int]'$2'; (& $wg show $1 latest-handshakes 2>$null | Where-Object{$_} | ForEach-Object{$now-[int64]($_ -split '\s+')[1]} | Where-Object{$_ -ge 0 -and $_ -lt $max}).Count}catch{0}"

# 4. Idade do handshake mais recente (segundos)
#    Retorna o menor valor (peer mais ativo). -1 se nenhum peer ou sem handshake.
UserParameter=wireguard.handshake.age[*],powershell -NoProfile -Command "try{$wg='C:\Program Files\WireGuard\wg.exe'; $now=[DateTimeOffset]::UtcNow.ToUnixTimeSeconds(); $ages=& $wg show $1 latest-handshakes 2>$null | Where-Object{$_} | ForEach-Object{$now-[int64]($_ -split '\s+')[1]} | Where-Object{$_ -ge 0}; if($ages){($ages | Measure-Object -Minimum).Minimum}else{-1}}catch{-1}"

# 5. Bytes recebidos (acumulado total de todos os peers)
#    O Zabbix calcula a taxa (Bps) via CHANGE_PER_SECOND no template
#    Campo [1] do split = rx bytes (0-indexed: [0]=pubkey, [1]=rx, [2]=tx)
UserParameter=wireguard.transfer.rx[*],powershell -NoProfile -Command "try{$wg='C:\Program Files\WireGuard\wg.exe'; $s=0; & $wg show $1 transfer 2>$null | Where-Object{$_} | ForEach-Object{$s+=[int64]($_ -split '\s+')[1]}; $s}catch{0}"

# 6. Bytes enviados (acumulado total de todos os peers)
UserParameter=wireguard.transfer.tx[*],powershell -NoProfile -Command "try{$wg='C:\Program Files\WireGuard\wg.exe'; $s=0; & $wg show $1 transfer 2>$null | Where-Object{$_} | ForEach-Object{$s+=[int64]($_ -split '\s+')[2]}; $s}catch{0}"

# 7. Latência ICMP para o peer ($1 = IP do peer, ex: 10.0.0.1)
#    Retorna RTT médio em ms (float). -1 se sem resposta.
#    Usa InvariantCulture para garantir ponto como separador decimal em sistemas pt-BR.
UserParameter=wireguard.latency[*],powershell -NoProfile -Command "try{$r=Test-Connection -ComputerName '$1' -Count 3 -ErrorAction Stop; $avg=($r | Measure-Object -Property ResponseTime -Average).Average; [math]::Round($avg,2).ToString([System.Globalization.CultureInfo]::InvariantCulture)}catch{-1}"
