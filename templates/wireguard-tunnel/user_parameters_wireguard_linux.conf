Timeout=30
UnsafeUserParameters=1

# ==============================================================================
# WireGuard Tunnel by Zabbix agent — UserParameters para Linux
# ==============================================================================
# Requisitos:
#   - wireguard-tools: pacote que fornece o comando 'wg' (sudo apt install wireguard-tools)
#   - O usuário zabbix deve poder executar 'wg show' sem senha via sudoers:
#       zabbix ALL=(ALL) NOPASSWD: /usr/bin/wg show *
#   - iproute2: comando 'ip' (geralmente já instalado)
#   - iputils-ping: comando 'ping' (geralmente já instalado)
#
# Instalar em: /etc/zabbix/zabbix_agent2.d/user_parameters_wireguard.conf
# Recarregar:  sudo systemctl restart zabbix-agent2
#
# Hosts que usam este arquivo:
#   - linux-gateway-1 (servidor com múltiplos peers, interface wg0,        peers.min=3)
#   - linux-gateway-2 (servidor com peer único,        interface systrix_wg0, peers.min=1)
# ==============================================================================

# 1. Interface ativa (1=up, 0=down/inexistente)
#    Usa 'ip link show' — não requer sudo
UserParameter=wireguard.interface.up[*],ip link show $1 2>/dev/null | grep -q "UP" && echo 1 || echo 0

# 2. Total de peers configurados
#    Requer sudo para 'wg show'
UserParameter=wireguard.peers.total[*],sudo wg show $1 peers 2>/dev/null | grep -c . || echo 0

# 3. Peers online (handshake mais recente que $2 segundos)
#    $1 = interface, $2 = {$WG.HANDSHAKE.MAX_AGE} (passado pelo Zabbix)
#    Usa $NF em vez de $2 no awk para evitar conflito com a substituição Zabbix
UserParameter=wireguard.peers.online[*],sudo wg show $1 latest-handshakes 2>/dev/null | awk -v now=$(date +%s) -v max=$2 '{age=now-$NF; if(age>=0 && age<max) c++} END{print c+0}' || echo 0

# 4. Idade do handshake mais recente (segundos)
#    Retorna o menor valor (peer mais ativo). -1 se nenhum peer ou sem handshake.
#    Usa $NF em vez de $2 no awk para evitar conflito com a substituição Zabbix
UserParameter=wireguard.handshake.age[*],sudo wg show $1 latest-handshakes 2>/dev/null | awk -v now=$(date +%s) 'BEGIN{min=999999} {age=now-$NF; if(age>=0 && age<min) min=age} END{print (min==999999)?-1:min}' || echo -1

# 5. Bytes recebidos (acumulado total de todos os peers)
#    O Zabbix calcula a taxa (Bps) via CHANGE_PER_SECOND no template
#    Usa $(NF-1) = penúltimo campo (rx) para evitar conflito com substituição Zabbix
UserParameter=wireguard.transfer.rx[*],sudo wg show $1 transfer 2>/dev/null | awk '{sum+=$(NF-1)} END{print sum+0}' || echo 0

# 6. Bytes enviados (acumulado total de todos os peers)
#    Usa $NF = último campo (tx) para evitar conflito com substituição Zabbix
UserParameter=wireguard.transfer.tx[*],sudo wg show $1 transfer 2>/dev/null | awk '{sum+=$NF} END{print sum+0}' || echo 0

# 7. Latência ICMP para o peer ($1 = IP do peer, ex: 10.0.0.1)
#    Retorna RTT médio em ms (float). -1 se sem resposta.
#    Usa grep + cut para evitar aspas simples no UserParameter (causam erro no Zabbix agent2).
#    A linha rtt do ping é: "rtt min/avg/max/mdev = 1.2/2.3/3.4/0.4 ms"
#    cut -d/ -f5 extrai o 5º campo separado por "/" = avg (ex: 2.3).
#    Se ping falhar, grep não casa, pipeline retorna código != 0 e || echo -1 assume.
UserParameter=wireguard.latency[*],ping -c 3 -W 2 -q $1 2>/dev/null | grep rtt | cut -d/ -f5 || echo -1
