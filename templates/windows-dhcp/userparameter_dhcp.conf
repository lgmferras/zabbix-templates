UserParameter=dhcp.v4.scope.stats[*],powershell.exe -NoProfile -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\dhcp_zbx.ps1" -Action V4ScopeStats -ScopeId "$1"
UserParameter=dhcp.v4.scope.get[*],powershell.exe -NoProfile -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\dhcp_zbx.ps1" -Action V4ScopeGet -ScopeId "$1"

UserParameter=dhcp.v4.scope.reservations.count[*],powershell.exe -NoProfile -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\dhcp_zbx.ps1" -Action V4ScopeReservationsCount -ScopeId "$1"
