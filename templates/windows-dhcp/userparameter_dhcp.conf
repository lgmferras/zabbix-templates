# Caminho do script DHCP — pasta de instalação do Zabbix Agent 2
# Copiar dhcp_zbx.ps1 para: C:\Program Files\Zabbix Agent 2\

UserParameter=dhcp.db.path,powershell.exe -NoProfile -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\dhcp_zbx.ps1" -Action DbPath
UserParameter=dhcp.backup.path,powershell.exe -NoProfile -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\dhcp_zbx.ps1" -Action BackupPath

UserParameter=dhcp.ipv4.enabled,powershell.exe -NoProfile -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\dhcp_zbx.ps1" -Action Ipv4Enabled
UserParameter=dhcp.ipv6.enabled,powershell.exe -NoProfile -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\dhcp_zbx.ps1" -Action Ipv6Enabled

UserParameter=dhcp.v4.scopes.count,powershell.exe -NoProfile -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\dhcp_zbx.ps1" -Action V4ScopesCount
