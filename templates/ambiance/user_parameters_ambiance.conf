# Zabbix Agent 2 — UserParameters: DormaKaba Ambiance
# Para: Windows Server com Zabbix Agent 2 (active mode)
# Destino: C:\Program Files\Zabbix Agent 2\zabbix_agent2.d\

############ ADVANCED PARAMETERS #################

Timeout=30

####### USER-DEFINED MONITORED PARAMETERS #######

UnsafeUserParameters=1

# ============================================================================
# dormakaba Ambiance — serviços e backup
# Testado em: Windows Server 2025 com Zabbix Agent 2 7.4
# ============================================================================

# ----------------------------------------------------------------------------
# SERVIÇOS DO AMBIANCE
# Cada item verifica se o processo do serviço Windows está em execução.
# Retorna: 1 = em execução, 0 = parado
# O processo DokaServiceManager.Service.API (ambiance.servicemanagerapi) ainda
# não teve o serviço Windows correspondente confirmado.
# ----------------------------------------------------------------------------
UserParameter=ambiance.webapi,powershell -NoProfile -Command "if(Get-Process -Name Kaba.Web.Gateway.API -ErrorAction SilentlyContinue){1}else{0}"
UserParameter=ambiance.aurorasync,powershell -NoProfile -Command "if(Get-Process -Name Kaba.AuroraSync.Service -ErrorAction SilentlyContinue){1}else{0}"
UserParameter=ambiance.client,powershell -NoProfile -Command "if(Get-Process -Name DokaClient -ErrorAction SilentlyContinue){1}else{0}"
UserParameter=ambiance.databaseengine,powershell -NoProfile -Command "if(Get-Process -Name Bus.DatabaseEngine.Service.Host -ErrorAction SilentlyContinue){1}else{0}"
UserParameter=ambiance.encoder,powershell -NoProfile -Command "if(Get-Process -Name Encoder.Service.Host -ErrorAction SilentlyContinue){1}else{0}"
UserParameter=ambiance.hubgateway,powershell -NoProfile -Command "if(Get-Process -Name HubGatewayService.Host -ErrorAction SilentlyContinue){1}else{0}"
UserParameter=ambiance.server,powershell -NoProfile -Command "if(Get-Process -Name KabaService -ErrorAction SilentlyContinue){1}else{0}"
UserParameter=ambiance.matrixsyncmanager,powershell -NoProfile -Command "if(Get-Process -Name Bus.MatrixSyncManager.Service.Host -ErrorAction SilentlyContinue){1}else{0}"
UserParameter=ambiance.pmsrestapi,powershell -NoProfile -Command "if(Get-Process -Name dkLockServerApiWs -ErrorAction SilentlyContinue){1}else{0}"
UserParameter=ambiance.servicemanagerapi,powershell -NoProfile -Command "if(Get-Process -Name DokaServiceManager.Service.API -ErrorAction SilentlyContinue){1}else{0}"
UserParameter=ambiance.hubmanager,powershell -NoProfile -Command "if(Get-Process -Name Kaba.Bus.HubManager.Service.Host -ErrorAction SilentlyContinue){1}else{0}"
UserParameter=ambiance.pmsagent,powershell -NoProfile -Command "if(Get-Process -Name Kaba.PMS.Agent.Host -ErrorAction SilentlyContinue){1}else{0}"
UserParameter=ambiance.pmsfias,powershell -NoProfile -Command "if(Get-Process -Name Kaba.PMS.FIAS.SocketService.Host -ErrorAction SilentlyContinue){1}else{0}"
UserParameter=ambiance.pmsirsagent,powershell -NoProfile -Command "if(Get-Process -Name Kaba.PMS.IRS.Agent.Host -ErrorAction SilentlyContinue){1}else{0}"
UserParameter=ambiance.pmsirssocket,powershell -NoProfile -Command "if(Get-Process -Name Kaba.PMS.IRS.SocketService.Host -ErrorAction SilentlyContinue){1}else{0}"
UserParameter=ambiance.pmsws,powershell -NoProfile -Command "if(Get-Process -Name 'MessengerNet PMSWS.Host' -ErrorAction SilentlyContinue){1}else{0}"
UserParameter=ambiance.mobilekeydelivery,powershell -NoProfile -Command "if(Get-Process -Name MobileKeyDeliveryService -ErrorAction SilentlyContinue){1}else{0}"
UserParameter=ambiance.bart,powershell -NoProfile -Command "if(Get-Process -Name PMS.BART.Service.Host -ErrorAction SilentlyContinue){1}else{0}"
UserParameter=ambiance.pmslgs,powershell -NoProfile -Command "if(Get-Process -Name PMS.LGS.API -ErrorAction SilentlyContinue){1}else{0}"
UserParameter=ambiance.skytouch,powershell -NoProfile -Command "if(Get-Process -Name PMS.SkyTouch.Service -ErrorAction SilentlyContinue){1}else{0}"
UserParameter=ambiance.vhe,powershell -NoProfile -Command "if(Get-Process -Name VHEService.Host -ErrorAction SilentlyContinue){1}else{0}"

# ----------------------------------------------------------------------------
# BACKUP DO BANCO (SQL Server, instância AMBIANCE)
# O job do SQL Server grava um arquivo por dia da semana, em rodízio:
#   AMBIANCE-Backup-1.bak ... AMBIANCE-Backup-7.bak
# Se a pasta de backup for outra, ajuste o caminho em todas as linhas abaixo.
# ----------------------------------------------------------------------------

# Idade do backup mais recente em HORAS
# Retorna: horas desde a gravação do .bak mais recente, ou -1 se não houver arquivo
UserParameter=ambiance.backup.age_hours,powershell -NoProfile -Command "$files = Get-ChildItem 'C:\Program Files\Microsoft SQL Server\MSSQL16.AMBIANCE\MSSQL\Backup\*.bak' -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^AMBIANCE-Backup-[1-7]\.bak$' }; if($files){ $newest = $files | Sort-Object LastWriteTime -Descending | Select-Object -First 1; ([math]::Round(((Get-Date) - $newest.LastWriteTime).TotalHours, 1)).ToString([System.Globalization.CultureInfo]::InvariantCulture) } else { -1 }"

# Tamanho do backup mais recente em BYTES (0 se não houver arquivo)
UserParameter=ambiance.backup.size,powershell -NoProfile -Command "$files = Get-ChildItem 'C:\Program Files\Microsoft SQL Server\MSSQL16.AMBIANCE\MSSQL\Backup\*.bak' -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^AMBIANCE-Backup-[1-7]\.bak$' }; if($files){ ($files | Sort-Object LastWriteTime -Descending | Select-Object -First 1).Length } else { 0 }"

# Nome do arquivo de backup mais recente
UserParameter=ambiance.backup.latest_file,powershell -NoProfile -Command "$files = Get-ChildItem 'C:\Program Files\Microsoft SQL Server\MSSQL16.AMBIANCE\MSSQL\Backup\*.bak' -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^AMBIANCE-Backup-[1-7]\.bak$' }; if($files){ ($files | Sort-Object LastWriteTime -Descending | Select-Object -First 1).Name } else { 'NONE' }"

# Data/hora do último backup (formato ISO; 'N/A' se não houver arquivo)
UserParameter=ambiance.backup.latest_time,powershell -NoProfile -Command "$files = Get-ChildItem 'C:\Program Files\Microsoft SQL Server\MSSQL16.AMBIANCE\MSSQL\Backup\*.bak' -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^AMBIANCE-Backup-[1-7]\.bak$' }; if($files){ ($files | Sort-Object LastWriteTime -Descending | Select-Object -First 1).LastWriteTime.ToString('yyyy-MM-dd HH:mm:ss') } else { 'N/A' }"

# Quantidade de arquivos de backup válidos (deve ser 7)
UserParameter=ambiance.backup.file_count,powershell -NoProfile -Command "(Get-ChildItem 'C:\Program Files\Microsoft SQL Server\MSSQL16.AMBIANCE\MSSQL\Backup\*.bak' -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^AMBIANCE-Backup-[1-7]\.bak$' }).Count"

# Tamanho total de todos os backups em BYTES
UserParameter=ambiance.backup.total_size,powershell -NoProfile -Command "$files = Get-ChildItem 'C:\Program Files\Microsoft SQL Server\MSSQL16.AMBIANCE\MSSQL\Backup\*.bak' -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^AMBIANCE-Backup-[1-7]\.bak$' }; if($files){ ($files | Measure-Object -Property Length -Sum).Sum } else { 0 }"
