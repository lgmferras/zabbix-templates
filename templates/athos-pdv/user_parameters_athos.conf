# Zabbix Agent 2 — UserParameters: ATHOS
# Para: Windows Server com Zabbix Agent 2 (active mode)
# Destino: C:\Program Files\Zabbix Agent 2\zabbix_agent2.d\

############ ADVANCED PARAMETERS #################

Timeout=30

####### USER-DEFINED MONITORED PARAMETERS #######

UnsafeUserParameters=1

# ============================================================
# ATHOS – UserParameters para Zabbix Agent 2
# Ambiente: Windows Server 2016
# Zabbix Agent: 7.4 (active)
#
# Objetivo:
# - Descobrir e monitorar processos do ecossistema Athos
# - Monitorar backup do Athos
# - Monitorar PostgreSQL local (porta 5432)
# - Monitorar crescimento e retenção de logs do Athos
#
# Todos os comandos retornam valores simples (1/0, número ou texto)
# compatíveis com itens Zabbix e triggers do template.
# ============================================================


# ============================================================
# PROCESSOS – GENÉRICO
# ============================================================

# ------------------------------------------------------------
# athos.proc.status[ProcessName]
# Retorna:
#   1 = processo está rodando
#   0 = processo parado ou não encontrado
#
# Uso no Zabbix:
#   athos.proc.status[pdv]
#   athos.proc.status[Athos]
# ------------------------------------------------------------
UserParameter=athos.proc.status[*],powershell -NoProfile -NoLogo -NonInteractive -ExecutionPolicy Bypass -Command "$p=Get-Process -Name '$1' -ErrorAction SilentlyContinue; if($p){1}else{0}"


# ------------------------------------------------------------
# athos.proc.running_list
# Retorna:
#   Lista em texto dos processos Athos que estão rodando no momento
#   Exemplo: "Athos, pdv, balcao"
#   Se nenhum estiver rodando: "NONE"
#
# Objetivo:
#   Inventário / descoberta manual de quais módulos o cliente usa
#
# OBS:
#   - Não usar trigger
#   - Usar como item TEXTO (delay >= 5m)
# ------------------------------------------------------------
UserParameter=athos.proc.running_list,powershell -NoProfile -NoLogo -NonInteractive -ExecutionPolicy Bypass -Command "$names=@('AthosBackup','Athos','Autoatendimento','Balathos','balcao','consultaComanda','consultaPreco','SAThos','pg_dump','criaBanco','delivery','ETQAthos','frenteVendaGrade','gacutil','gerenciadorConsultaPreco','gerenciadorConsultaTanca','MTGertec','MTImpressao','mtMonitoramento','mtWillTechGradual','NFSe','notaEntrada','nothos','pdv','prathos','prathosTouch','Relatorio','sincronizadorScanntech','Sintegra','suporteremoto','syncCardapioDigital','verificaAtualizacao','wCamVG','dwagsvc'); $procs=(Get-Process -ErrorAction SilentlyContinue | Select-Object -ExpandProperty ProcessName); $running=$names | Where-Object { $procs -contains $_ }; if($running){ $running -join ', ' } else { 'NONE' }"


# ============================================================
# SERVIÇOS WINDOWS – GENÉRICO
# ============================================================

# ------------------------------------------------------------
# athos.svc.status[ServiceName]
# Retorna:
#   1 = serviço em execução (Running)
#   0 = serviço parado ou não encontrado
#
# Uso no Zabbix:
#   athos.svc.status[postgresql-x64-14]
#   athos.svc.status[Spooler]
#
# Dica:
#   Sempre usar o *ServiceName* (nome curto), não o DisplayName
# ------------------------------------------------------------
UserParameter=athos.svc.status[*],powershell -NoProfile -NoLogo -NonInteractive -ExecutionPolicy Bypass -Command "$s=Get-Service -Name '$1' -ErrorAction SilentlyContinue; if($s -and $s.Status -eq 'Running'){1}else{0}"


# ============================================================
# BACKUP ATHOS
# Diretório: C:\Athos\backupAthos\
# Padrão: athosdom|athosseg|athoster|athosqua|athosqui|athossex|athossßb.backup
# ============================================================

# ------------------------------------------------------------
# athos.backup.running
# Retorna:
#   1 = pg_dump em execução (backup rodando)
#   0 = pg_dump não está rodando
# ------------------------------------------------------------
UserParameter=athos.backup.running,powershell -NoProfile -NoLogo -NonInteractive -ExecutionPolicy Bypass -Command "$p=Get-Process -Name 'pg_dump' -ErrorAction SilentlyContinue; if($p){1}else{0}"


# ------------------------------------------------------------
# athos.backup.age_hours
# Retorna:
#   Horas desde o último backup (float, 1 casa decimal, com ponto)
#   -1 = nenhum backup válido encontrado
#
# IMPORTANTE:
#   Força InvariantCulture para evitar vírgula decimal (pt-BR)
# ------------------------------------------------------------
UserParameter=athos.backup.age_hours,powershell -NoProfile -NoLogo -NonInteractive -ExecutionPolicy Bypass -Command "$path='C:\Athos\backupAthos\*.backup'; $rx='^(athosdom|athosseg|athoster|athosqua|athosqui|athossex|athossßb)\.backup$'; $files=Get-ChildItem $path -ErrorAction SilentlyContinue | Where-Object { $_.Name -match $rx }; if($files){ $newest=$files | Sort-Object LastWriteTime -Descending | Select-Object -First 1; $h=[math]::Round(((Get-Date)-$newest.LastWriteTime).TotalHours,1); [string]::Format([System.Globalization.CultureInfo]::InvariantCulture,'{0:0.0}',$h) } else { -1 }"


# ------------------------------------------------------------
# athos.backup.size
# Retorna:
#   Tamanho do backup mais recente (bytes)
# ------------------------------------------------------------
UserParameter=athos.backup.size,powershell -NoProfile -NoLogo -NonInteractive -ExecutionPolicy Bypass -Command "$path='C:\Athos\backupAthos\*.backup'; $rx='^(athosdom|athosseg|athoster|athosqua|athosqui|athossex|athossßb)\.backup$'; $files=Get-ChildItem $path -ErrorAction SilentlyContinue | Where-Object { $_.Name -match $rx }; if($files){ ($files | Sort-Object LastWriteTime -Descending | Select-Object -First 1).Length } else { 0 }"


# ------------------------------------------------------------
# athos.backup.latest_file
# Retorna:
#   Nome do arquivo de backup mais recente
# ------------------------------------------------------------
UserParameter=athos.backup.latest_file,powershell -NoProfile -NoLogo -NonInteractive -ExecutionPolicy Bypass -Command "$path='C:\Athos\backupAthos\*.backup'; $rx='^(athosdom|athosseg|athoster|athosqua|athosqui|athossex|athossßb)\.backup$'; $files=Get-ChildItem $path -ErrorAction SilentlyContinue | Where-Object { $_.Name -match $rx }; if($files){ ($files | Sort-Object LastWriteTime -Descending | Select-Object -First 1).Name } else { 'NONE' }"


# ------------------------------------------------------------
# athos.backup.latest_time
# Retorna:
#   Timestamp do backup mais recente (YYYY-MM-DD HH:MM:SS)
# ------------------------------------------------------------
UserParameter=athos.backup.latest_time,powershell -NoProfile -NoLogo -NonInteractive -ExecutionPolicy Bypass -Command "$path='C:\Athos\backupAthos\*.backup'; $rx='^(athosdom|athosseg|athoster|athosqua|athosqui|athossex|athossßb)\.backup$'; $files=Get-ChildItem $path -ErrorAction SilentlyContinue | Where-Object { $_.Name -match $rx }; if($files){ ($files | Sort-Object LastWriteTime -Descending | Select-Object -First 1).LastWriteTime.ToString('yyyy-MM-dd HH:mm:ss') } else { 'N/A' }"


# ------------------------------------------------------------
# athos.backup.file_count
# Retorna:
#   Quantidade de arquivos .backup válidos encontrados
# ------------------------------------------------------------
UserParameter=athos.backup.file_count,powershell -NoProfile -NoLogo -NonInteractive -ExecutionPolicy Bypass -Command "$path='C:\Athos\backupAthos\*.backup'; $rx='^(athosdom|athosseg|athoster|athosqua|athosqui|athossex|athossßb)\.backup$'; (Get-ChildItem $path -ErrorAction SilentlyContinue | Where-Object { $_.Name -match $rx }).Count"


# ------------------------------------------------------------
# athos.backup.total_size
# Retorna:
#   Soma do tamanho de todos os backups válidos (bytes)
# ------------------------------------------------------------
UserParameter=athos.backup.total_size,powershell -NoProfile -NoLogo -NonInteractive -ExecutionPolicy Bypass -Command "$path='C:\Athos\backupAthos\*.backup'; $rx='^(athosdom|athosseg|athoster|athosqua|athosqui|athossex|athossßb)\.backup$'; $files=Get-ChildItem $path -ErrorAction SilentlyContinue | Where-Object { $_.Name -match $rx }; if($files){ ($files | Measure-Object -Property Length -Sum).Sum } else { 0 }"


# ------------------------------------------------------------
# athos.backup.today_ok
# Retorna:
#   1 = backup do dia existe e foi gravado hoje
#   0 = backup do dia não existe ou está desatualizado
# ------------------------------------------------------------
UserParameter=athos.backup.today_ok,powershell -NoProfile -NoLogo -NonInteractive -ExecutionPolicy Bypass -Command "$dias=@{0='athosdom';1='athosseg';2='athoster';3='athosqua';4='athosqui';5='athossex';6='athossßb'}; $prefixo=$dias[[int](Get-Date).DayOfWeek]; $file=\"C:\Athos\backupAthos\$($prefixo).backup\"; $f=Get-Item -LiteralPath $file -ErrorAction SilentlyContinue; if($f -and $f.LastWriteTime.Date -eq (Get-Date).Date){1}else{0}"


# ============================================================
# POSTGRESQL (LOCAL)
# ============================================================

# ------------------------------------------------------------
# athos.pg.port_ok
# Retorna:
#   1 = porta 5432 respondendo em 127.0.0.1
#   0 = porta não responde
#
# Verifica disponibilidade real do banco
# ------------------------------------------------------------
UserParameter=athos.pg.port_ok,powershell -NoProfile -NoLogo -NonInteractive -ExecutionPolicy Bypass -Command "try { if((Test-NetConnection -ComputerName 127.0.0.1 -Port 5432 -WarningAction SilentlyContinue).TcpTestSucceeded){1}else{0} } catch { 0 }"


# ============================================================
# LOGS ATHOS
# Diretório: C:\logAthos\
# ============================================================

# ------------------------------------------------------------
# athos.log.size_bytes
# Retorna:
#   Tamanho total da pasta de logs (bytes)
# ------------------------------------------------------------
UserParameter=athos.log.size_bytes,powershell -NoProfile -NoLogo -NonInteractive -ExecutionPolicy Bypass -Command "try { $p='C:\logAthos\'; if(Test-Path $p){ (Get-ChildItem $p -File -Recurse -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum } else { 0 } } catch { 0 }"


# ------------------------------------------------------------
# athos.log.oldest_days
# Retorna:
#   Idade (em dias) do arquivo de log mais antigo
#   -1 = nenhum arquivo encontrado
# ------------------------------------------------------------
UserParameter=athos.log.oldest_days,powershell -NoProfile -NoLogo -NonInteractive -ExecutionPolicy Bypass -Command "$p='C:\logAthos'; if(!(Test-Path $p)){-1} else { $f=Get-ChildItem $p -File -Recurse -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -First 1; if($f){ $d=[math]::Round(((Get-Date)-$f.LastWriteTime).TotalDays,1); [string]::Format([System.Globalization.CultureInfo]::InvariantCulture,'{0:0.0}',$d) } else { -1 } }"
