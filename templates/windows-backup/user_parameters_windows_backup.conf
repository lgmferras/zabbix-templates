# Zabbix Agent 2 — UserParameters: Windows Server Backup (wbadmin)
# Para: Windows Server com Zabbix Agent 2 (active mode)
# Destino: C:\Program Files\Zabbix Agent 2\zabbix_agent2.d\

############ ADVANCED PARAMETERS #################

Timeout=30

####### USER-DEFINED MONITORED PARAMETERS #######

UnsafeUserParameters=1

# ============================================================================
# WINDOWS SERVER BACKUP (wbadmin) – Zabbix Agent 2
# Windows Server 2016+ / Zabbix 7.4
# Fonte de dados: Event Log Microsoft-Windows-Backup
#   Event ID 1 = backup iniciado
#   Event ID 4 = backup concluído com sucesso
# ============================================================================

# Existe backup registrado?
# 1 = wbadmin get versions funciona | 0 = falha/não existe
UserParameter=win.backup.exists,powershell -NoProfile -NoLogo -NonInteractive -ExecutionPolicy Bypass -Command "try { wbadmin get versions | Out-Null; 1 } catch { 0 }"

# Backup em execução no momento?
# 1 = backup iniciado (Event ID 1) sem conclusão posterior (Event ID 4)
# 0 = nenhum backup em andamento
UserParameter=win.backup.running,powershell -NoProfile -NoLogo -NonInteractive -ExecutionPolicy Bypass -Command "$start=Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-Backup'; Id=1} -MaxEvents 1 -ErrorAction SilentlyContinue; $end=Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-Backup'; Id=4} -MaxEvents 1 -ErrorAction SilentlyContinue; if($start){ if(!$end -or $start.TimeCreated -gt $end.TimeCreated){1}else{0} } else {0}"

# Último backup com evento de sucesso (Event ID 4)?
# 1 = encontrou evento | 0 = não encontrou
UserParameter=win.backup.last_ok,powershell -NoProfile -NoLogo -NonInteractive -ExecutionPolicy Bypass -Command "$e=Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-Backup'; Id=4} -MaxEvents 1 -ErrorAction SilentlyContinue; if($e){1}else{0}"

# Data/hora do último backup bem-sucedido (texto)
# Retorna: "YYYY-MM-DD HH:MM:SS" ou "N/A" se não encontrado
UserParameter=win.backup.last_time,powershell -NoProfile -NoLogo -NonInteractive -ExecutionPolicy Bypass -Command "$e=Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-Backup'; Id=4} -MaxEvents 1 -ErrorAction SilentlyContinue; if($e){ $e.TimeCreated.ToString('yyyy-MM-dd HH:mm:ss') } else { 'N/A' }"

# Idade do último backup em horas (float com ponto decimal)
# Retorna: horas desde o último sucesso, ou -1 se não encontrado
UserParameter=win.backup.age_hours,powershell -NoProfile -NoLogo -NonInteractive -ExecutionPolicy Bypass -Command "$e=Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-Backup'; Id=4} -MaxEvents 1 -ErrorAction SilentlyContinue; if($e){ $h=[math]::Round(((Get-Date)-$e.TimeCreated).TotalHours,1); [string]::Format([System.Globalization.CultureInfo]::InvariantCulture,'{0:0.0}',$h) } else { -1 }"
