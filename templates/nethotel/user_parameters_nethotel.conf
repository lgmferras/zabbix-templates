# Zabbix Agent 2 — UserParameters: NETHOTEL
# Para: Windows Server com Zabbix Agent 2 (active mode)
# Destino: C:\Program Files\Zabbix Agent 2\zabbix_agent2.d\

############ ADVANCED PARAMETERS #################

Timeout=30

####### USER-DEFINED MONITORED PARAMETERS #######

UnsafeUserParameters=1

# ============================================================================
# NETHOTEL Process Monitoring
# Para: Windows Server 2025 com Zabbix Agent 7.4
# ============================================================================

# ----------------------------------------------------------------------------
# MONITORAMENTO DE PROCESSOS
# ----------------------------------------------------------------------------
UserParameter=nethotel.diaria,powershell -NoProfile -Command "if(Get-Process -Name diaria -ErrorAction SilentlyContinue){1}else{0}"
UserParameter=nethotel.becape,powershell -NoProfile -Command "if(Get-Process -Name becape -ErrorAction SilentlyContinue){1}else{0}"
UserParameter=nethotel.reshotel,powershell -NoProfile -Command "if(Get-Process -Name reshotel -ErrorAction SilentlyContinue){1}else{0}"
UserParameter=nethotel.netnfse,powershell -NoProfile -Command "if(Get-Process -Name netnfse -ErrorAction SilentlyContinue){1}else{0}"
UserParameter=nethotel.netnfe,powershell -NoProfile -Command "if(Get-Process -Name netnfe -ErrorAction SilentlyContinue){1}else{0}"
UserParameter=nethotel.netnfce,powershell -NoProfile -Command "if(Get-Process -Name netnfce -ErrorAction SilentlyContinue){1}else{0}"
UserParameter=nethotel.servicob2b,powershell -NoProfile -Command "if(Get-Process -Name ServicoIntegracaoB2BReservas -ErrorAction SilentlyContinue){1}else{0}"

# ----------------------------------------------------------------------------
# MONITORAMENTO AVANÇADO DE BACKUP
# ----------------------------------------------------------------------------

# Verifica se gbak.exe está rodando (backup em execução)
# Retorna: 1 = backup em andamento, 0 = backup não está rodando
UserParameter=nethotel.backup.running,powershell -NoProfile -Command "if(Get-Process -Name gbak -ErrorAction SilentlyContinue){1}else{0}"

# Idade do backup mais recente em HORAS
# Retorna: número de horas desde o último backup (arquivo .GBK mais recente)
UserParameter=nethotel.backup.age_hours,powershell -NoProfile -Command "$files = Get-ChildItem 'C:\NETHOTEL\*.GBK' -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^(DOM|SEG|TER|QUA|QUI|SEX|SAB)EMA\.GBK$' }; if($files){ $newest = $files | Sort-Object LastWriteTime -Descending | Select-Object -First 1; ([math]::Round(((Get-Date) - $newest.LastWriteTime).TotalHours, 1)).ToString([System.Globalization.CultureInfo]::InvariantCulture) } else { -1 }"

# Tamanho do backup mais recente em BYTES
UserParameter=nethotel.backup.size,powershell -NoProfile -Command "$files = Get-ChildItem 'C:\NETHOTEL\*.GBK' -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^(DOM|SEG|TER|QUA|QUI|SEX|SAB)EMA\.GBK$' }; if($files){ ($files | Sort-Object LastWriteTime -Descending | Select-Object -First 1).Length } else { 0 }"

# Nome do arquivo de backup mais recente
UserParameter=nethotel.backup.latest_file,powershell -NoProfile -Command "$files = Get-ChildItem 'C:\NETHOTEL\*.GBK' -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^(DOM|SEG|TER|QUA|QUI|SEX|SAB)EMA\.GBK$' }; if($files){ ($files | Sort-Object LastWriteTime -Descending | Select-Object -First 1).Name } else { 'NONE' }"

# Data/hora do último backup (formato ISO)
UserParameter=nethotel.backup.latest_time,powershell -NoProfile -Command "$files = Get-ChildItem 'C:\NETHOTEL\*.GBK' -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^(DOM|SEG|TER|QUA|QUI|SEX|SAB)EMA\.GBK$' }; if($files){ ($files | Sort-Object LastWriteTime -Descending | Select-Object -First 1).LastWriteTime.ToString('yyyy-MM-dd HH:mm:ss') } else { 'N/A' }"

# Quantidade de arquivos de backup válidos (deve ser 7)
UserParameter=nethotel.backup.file_count,powershell -NoProfile -Command "(Get-ChildItem 'C:\NETHOTEL\*.GBK' -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^(DOM|SEG|TER|QUA|QUI|SEX|SAB)EMA\.GBK$' }).Count"

# Tamanho total de todos os backups em BYTES
UserParameter=nethotel.backup.total_size,powershell -NoProfile -Command "$files = Get-ChildItem 'C:\NETHOTEL\*.GBK' -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^(DOM|SEG|TER|QUA|QUI|SEX|SAB)EMA\.GBK$' }; if($files){ ($files | Measure-Object -Property Length -Sum).Sum } else { 0 }"

# Backup do dia esperado existe e está atualizado?
# Retorna: 1 = backup do dia OK, 0 = backup do dia não existe ou está desatualizado
UserParameter=nethotel.backup.today_ok,powershell -NoProfile -Command "$dias = @{0='DOM';1='SEG';2='TER';3='QUA';4='QUI';5='SEX';6='SAB'}; $prefixo = $dias[[int](Get-Date).DayOfWeek]; $arquivo = Get-ChildItem \"C:\NETHOTEL\$($prefixo)EMA.GBK\" -ErrorAction SilentlyContinue; if($arquivo -and $arquivo.LastWriteTime.Date -eq (Get-Date).Date){1}else{0}"
